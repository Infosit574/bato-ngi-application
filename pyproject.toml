[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "bato"
version = "0.1.0"
description = "BATO application skeleton by Infosit d.o.o."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "AGPL-3.0-or-later"
license-files = ["license.txt", "LICENSES/*"]
authors = [{name = "Infosit d.o.o.", email = "info@infosit.com"}]
dependencies = [
    "fastapi==0.161.0",
    "mcp==1.30.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
]

[project.scripts]
bato-mcp = "bato.mcp.server:main"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.0",
    "pip-licenses==5.5.5",
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bato"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "bato.mcp.server"
# The MCP SDK exposes untyped registration decorators.
disallow_untyped_decorators = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
markers = ["deployment: requires a running Docker Compose deployment"]
addopts = "-m 'not deployment'"
